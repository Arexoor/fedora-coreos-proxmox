---
all:
  children:
    raspberrypi:
      hosts:
        pi:
          # CHANGEME: IP or hostname of the Raspberry Pi.
          ansible_host: 10.0.10.2
      vars:
        ansible_user: core
        ansible_ssh_private_key_file: ~/.ssh/id_rsa
        ansible_become: true
        ansible_become_method: sudo
